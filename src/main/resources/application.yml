spring:
  application:
    name: forum
  profiles:
    active: development
  datasource:
    driverClassName: org.h2.Driver
    url: jdbc:h2:mem:forumdb
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 8080
  servlet:
    context-path: /api

# Logging
logging:
  level:
    root: INFO
    dev.andrey.forum: DEBUG

# API Configuration - Use environment variables for secrets
# DO NOT commit actual API keys to this file
ai:
  provider: ${AI_PROVIDER:openai}
  model:
    api-key: ${AI_API_KEY:}

xai:
  api:
    key: ${XAI_API_KEY:}

openai:
  api:
    key: ${OPENAI_API_KEY:}
