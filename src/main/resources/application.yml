spring:
  application:
    name: forum
  profiles:
    active: development
  datasource:
    driverClassName: org.h2.Driver
    url: jdbc:h2:mem:forumdb
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    placeholders:
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

jwt:
    secret: ${JWT_SECRET}

server:
  port: 8081

# Logging
logging:
  level:
    root: INFO
    dev.andrey.forum: DEBUG

# API Configuration - Use environment variables for secrets
# DO NOT commit actual API keys to this file
ai:
  provider: ${AI_PROVIDER:openai}
  model:
    api-key: ${AI_API_KEY:}

xai:
  api:
    key: ${XAI_API_KEY:}

openai:
  api:
    key: ${OPENAI_API_KEY:}

# Default User Configuration
app:
  usuario:
    padrao:
      nome: ${APP_USUARIO_PADRAO_NOME}
      email: ${APP_USUARIO_PADRAO_EMAIL}
      password: ${APP_USUARIO_PADRAO_PASSWORD}

