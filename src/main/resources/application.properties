spring.application.name=forum
server.port=8080
server.servlet.context-path=/api

# Environment
spring.profiles.active=development

# Logging
logging.level.root=INFO
logging.level.dev.andrey.forum=DEBUG

# API Configuration - Use environment variables for secrets
# DO NOT commit actual API keys to this file
ai.provider=${AI_PROVIDER:openai}
ai.model.api-key=${AI_API_KEY:}
xai.api.key=${XAI_API_KEY:}
openai.api.key=${OPENAI_API_KEY:}
